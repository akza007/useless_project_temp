<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIVAL RUSH: RISE OF THE SEVEN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080711;
      color: #ffffff;
      font-family: 'Press Start 2P', 'Segoe UI', Courier, monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      width: 960px;
      height: 540px;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), 0 0 10px rgba(255, 0, 128, 0.6);
      border: 4px solid #1f1b38;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      outline: none;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    if (typeof Phaser === 'undefined') {
      document.write('<script src="./phaser.min.js"><\/script>');
    }
  </script>
</head>
<body>
  <div id="game-container" tabindex="0"></div>
  <script>
    // Ensure keyboard focus is captured immediately by game container
    window.addEventListener('load', function() {
      const container = document.getElementById('game-container');
      if (container) container.focus();
    });
    window.addEventListener('click', function() {
      const container = document.getElementById('game-container');
      if (container) container.focus();
    });
    // Prevent browser scrolling on game keys
    window.addEventListener('keydown', function(e) {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) > -1) {
        e.preventDefault();
      }
    }, false);
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
